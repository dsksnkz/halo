<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes">
<title>Halo</title>
<link rel="stylesheet" href="xterm.css"><link rel="stylesheet" href="style.css?v=landscape-swipe-2">
</head>
<body>
<main id="dashboard">
  <section class="panel system" aria-label="PC system information; tap for fullscreen, swipe left or right in landscape to change background" role="button" tabindex="0">
    <pre class="logo" aria-label="HALO">    __  _____    __    ____ 
   / / / /   |  / /   / __ \
  / /_/ / /| | / /   / / / /
 / __  / ___ |/ /___/ /_/ / 
/_/ /_/_/  |_/_____/\____/  </pre>
    <dl id="stats"><dt>host</dt><dd>connecting to arch…</dd></dl>
  </section>
  <section class="panel lava" aria-label="Live lavat animation"><div id="terminal"></div><canvas id="cava" aria-label="Live PC audio spectrum"></canvas><span class="visualizer-name" aria-live="polite">lavat</span></section>
  <section class="panel assistant" aria-label="Halo assistant">
    <header class="assistant-header"><span id="model-name">GEMINI 3.5 LITE</span><button id="wake" aria-label="Toggle Halo wake detection" aria-pressed="false">HALO · OFF</button></header>

    <div class="state"><div id="signal" aria-hidden="true"><i></i></div><h1 id="status" aria-live="polite">IDLE</h1><p id="hint" hidden></p></div>
    <div id="agent-permissions" hidden></div>
    <div id="transcript" aria-live="polite"></div>
    <div id="orb-view" aria-label="Microphone circle; long press to switch view"><canvas id="orb"></canvas></div>
    <nav aria-label="Assistant controls"><button id="web" aria-label="Toggle internet search" aria-pressed="true">WEB</button><button id="mic" aria-label="Start or stop recording">MIC</button><button id="sound" aria-label="Toggle spoken replies" aria-pressed="true">VOICE</button><button id="replay" disabled aria-label="Replay the last reply">REPLAY</button><button id="copy" disabled aria-label="Copy the last reply">COPY</button><button id="clear" aria-label="Clear conversation">CLEAR</button><button id="agent-stop" aria-label="Stop the laptop agent">STOP</button></nav>
  </section>
</main>
<script src="xterm.js"></script><script src="fit.js"></script><script src="app.js?v=local-qwen-1"></script><script src="orb.js?v=soft-idle-2"></script><script src="wake.js?v=reliable-1"></script><script src="agent.js?v=live-2"></script><script src="native.js?v=wifi-1"></script>
</body></html>
