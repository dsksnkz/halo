<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Halo Music</title>
<link rel="stylesheet" href="music.css">
</head>
<body data-state="idle">
<canvas id="bars" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main id="music">
  <header class="meta">
    <h1 class="title"><span id="title"></span></h1>
    <p class="artist"><span id="artist"></span></p>
  </header>
  <section class="deck">
    <div class="side">
      <button id="previous" class="control" aria-label="Previous track"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="2.4" height="14" rx="1.1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.5.9L8.6 13a1.2 1.2 0 0 1 0-2l8.9-5.7a1 1 0 0 1 1.5.9Z"/></svg></button>
      <button id="shuffle" class="control small" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1.1 1.7 2.3 2.7 4.3 2.7H21"/><path d="M3 17h3.5c1.3 0 2.2-.4 3-1.1M14 8.1c.8-.7 1.7-1.1 3-1.1H21"/><path d="m18.5 4.5 2.5 2.5-2.5 2.5M18.5 14.5l2.5 2.5-2.5 2.5"/></svg></button>
    </div>
    <button id="cover" class="cover" aria-label="Play or pause">
      <span class="art"></span>
      <span class="pulse" aria-hidden="true"><svg class="play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1.1 1.1 0 0 0 0-1.8l-10-6.4A1 1 0 0 0 8 5.6Z"/></svg><svg class="pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg></span>
    </button>
    <div class="side">
      <button id="next" class="control" aria-label="Next track"><svg viewBox="0 0 24 24"><rect x="17.6" y="5" width="2.4" height="14" rx="1.1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.5.9l8.9-5.7a1.2 1.2 0 0 0 0-2L6.5 5.3a1 1 0 0 0-1.5.9Z"/></svg></button>
      <button id="loop" class="control small" aria-label="Repeat" data-loop="None"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19"/><path d="m16 3 3 3-3 3"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5"/><path d="m8 21-3-3 3-3"/></svg><b>1</b></button>
    </div>
  </section>
  <footer class="timeline">
    <time id="elapsed">0:00</time>
    <div id="track" class="track" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><i id="fill"></i></div>
    <time id="duration">0:00</time>
  </footer>
</main>
<p id="empty" class="empty">Nothing playing</p>
<script src="music.js"></script>
</body>
</html>
